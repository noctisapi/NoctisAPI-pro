{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ feature_name }}</h1>
    <div class="sub">Pro feature</div>
  </div>
</div>
<div class="card" style="max-width:480px; margin: 32px auto; text-align:center;">
  <div class="card-body" style="padding:32px 24px; display:flex; flex-direction:column; align-items:center; gap:14px;">
    <div style="font-size:28px; line-height:1;">🔒</div>
    <div>
      <div style="font-weight:700; font-size:15px; margin-bottom:6px;">Pro edition required</div>
      <div class="muted small-text"><strong style="color:var(--text);">{{ feature_name }}</strong> is available on the Pro edition.</div>
    </div>
    <a href="https://www.noctisapi.com/#comparison" target="_blank" rel="noreferrer" class="btn btn-primary">Upgrade to Pro →</a>
    <a href="/dashboard" class="back" style="margin:0;">← Back to dashboard</a>
  </div>
</div>
{% endblock %}
