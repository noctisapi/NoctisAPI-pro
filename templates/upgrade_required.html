{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ feature_name }}</h1>
</div>
<div class="empty-state" style="margin-top:3rem; text-align:center;">
  <div style="font-size:2.5rem; margin-bottom:1rem;">🔒</div>
  <div class="empty-state-title">Pro feature</div>
  <div class="empty-state-sub" style="margin-bottom:1.5rem;">
    <strong>{{ feature_name }}</strong> is available on the Pro edition.
  </div>
  <a
    href="https://www.noctisapi.com/#comparison"
    target="_blank"
    rel="noreferrer"
    class="btn btn-primary"
  >Upgrade to Pro →</a>
  <div style="margin-top:1rem;">
    <a href="/dashboard" class="link muted">← Back to dashboard</a>
  </div>
</div>
{% endblock %}
