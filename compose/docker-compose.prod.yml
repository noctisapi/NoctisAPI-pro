services:
  migrate:
    image: ${HP_IMAGE:-ghcr.io/0x-unkwn0wn/noctisapi-pro}:${APP_VERSION}
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:0 /data /var/lib/myapp && alembic upgrade head"]
    env_file:
      - ../.env.prod
    volumes:
      - hp_prod_data:/data
      - hp_prod_myapp:/var/lib/myapp
    restart: "no"

  app:
    image: ${HP_IMAGE:-ghcr.io/0x-unkwn0wn/noctisapi-pro}:${APP_VERSION}
    user: "10001:0"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ../.env.prod
    environment:
      - PYTHONPATH=/app
    command: ["python", "main.py"]
    volumes:
      - hp_prod_data:/data
      - hp_prod_myapp:/var/lib/myapp
      - /etc/machine-id:/etc/host-machine-id:ro
      - ../data/siem:/var/log/noctisapi
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "scripts/check_app_ready.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  admin:
    image: ${HP_IMAGE:-ghcr.io/0x-unkwn0wn/noctisapi-pro}:${APP_VERSION}
    user: "10001:0"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ../.env.prod
    environment:
      - PYTHONPATH=/app
      - HONEYPOT_MONITOR_BASE_URL=http://app:8000
      - HP_PANEL_TOKEN=${HP_PANEL_TOKEN}
    command: ["python", "main_panel.py"]
    volumes:
      - hp_prod_data:/data
      - hp_prod_myapp:/var/lib/myapp
      - /etc/machine-id:/etc/host-machine-id:ro
    expose:
      - "9001"
    ports:
      - "127.0.0.1:9001:9001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  traefik-config:
    image: alpine:3.20
    volumes:
      - ./traefik/render-dynamic-config.sh:/render/render-dynamic-config.sh:ro
      - traefik_dynamic_config:/etc/traefik/dynamic
    environment:
      - HP_PUBLIC_HOST=${HP_PUBLIC_HOST}
      - HP_PUBLIC_RATELIMIT_AVG=${HP_PUBLIC_RATELIMIT_AVG:-120}
      - HP_PUBLIC_RATELIMIT_BURST=${HP_PUBLIC_RATELIMIT_BURST:-240}
    command: ["sh", "/render/render-dynamic-config.sh"]
    restart: "no"

  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.webinternal.address=:8081"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:8081"
    volumes:
      - traefik_dynamic_config:/etc/traefik/dynamic:ro
      - traefik_letsencrypt:/letsencrypt
    depends_on:
      traefik-config:
        condition: service_completed_successfully
      app:
        condition: service_healthy
      admin:
        condition: service_started

volumes:
  hp_prod_data:
  hp_prod_myapp:
  traefik_letsencrypt:
  traefik_dynamic_config:
