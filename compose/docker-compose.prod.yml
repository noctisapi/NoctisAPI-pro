services:
  migrate:
    image: ${HP_IMAGE:-ghcr.io/0x-unkwn0wn/noctisapi-pro}:${APP_VERSION}
    # Stays root, capabilities un-dropped: it must chown fresh volumes to the
    # 10001:0 app/admin run as (CAP_CHOWN) before writing into them itself as
    # root (CAP_DAC_OVERRIDE), which is exactly what dropping capabilities
    # here would break. Not a real exposure: short-lived, processes no
    # attacker-reachable input, and runs before app/admin/traefik even start.
    user: "0:0"
    # NOC-023: re-chown *after* the migration too, not just before it --
    # alembic creates the sqlite file (and its WAL/SHM siblings) as root
    # during upgrade head, so a chown that only runs beforehand never
    # touches it. Without this, app/admin (running as 10001:0) hit
    # "attempt to write a readonly database" on every truly fresh volume,
    # 100% reproducibly -- caught here because this Issue's "clean
    # instance works in staging" criterion was the first time anyone
    # actually ran `up` against a brand-new volume instead of just
    # `config`-validating the file.
    command: ["sh", "-c", "chown -R 10001:0 /data /var/lib/myapp && alembic upgrade head && chown -R 10001:0 /data /var/lib/myapp"]
    env_file:
      - ../.env.prod
    volumes:
      - hp_prod_data:/data
      - hp_prod_myapp:/var/lib/myapp
    networks:
      - net-internal
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    restart: "no"

  app:
    image: ${HP_IMAGE:-ghcr.io/0x-unkwn0wn/noctisapi-pro}:${APP_VERSION}
    user: "10001:0"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ../.env.prod
    environment:
      - PYTHONPATH=/app
    command: ["python", "main.py"]
    volumes:
      - hp_prod_data:/data
      - hp_prod_myapp:/var/lib/myapp
      - /etc/machine-id:/etc/host-machine-id:ro
      - ../data/siem:/var/log/noctisapi
    expose:
      - "8000"
    networks:
      - net-edge
    mem_limit: ${HP_APP_MEM_LIMIT:-512m}
    cpus: 1.0
    pids_limit: 128
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        # NOC-028: also checks the HTTP server itself answers, not just
        # the DB migration state -- uvicorn can hang/crash while the DB
        # file on disk stays perfectly fine.
        ["CMD", "python", "scripts/check_app_ready.py", "--http-port", "8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  admin:
    image: ${HP_IMAGE:-ghcr.io/0x-unkwn0wn/noctisapi-pro}:${APP_VERSION}
    user: "10001:0"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ../.env.prod
    environment:
      - PYTHONPATH=/app
      # Routed through Traefik's internal entrypoint, not straight to `app`,
      # so admin never needs to be on the same Docker network as the public
      # decoy surface (see NOC-011 / net-edge vs net-internal below).
      - HONEYPOT_MONITOR_BASE_URL=http://traefik:8081
    command: ["python", "main_panel.py"]
    volumes:
      - hp_prod_data:/data
      - hp_prod_myapp:/var/lib/myapp
      - /etc/machine-id:/etc/host-machine-id:ro
    expose:
      - "9001"
    # NOC-016: no `ports:` here on purpose. The admin port is never published
    # on any interface, not even loopback -- it's reached exclusively through
    # the cloudflared sidecar below, over net-internal. Without a configured
    # tunnel there is no public route to it at all (acceptance criterion).
    networks:
      - net-internal
    mem_limit: ${HP_ADMIN_MEM_LIMIT:-512m}
    cpus: 1.0
    pids_limit: 128
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # NOC-028: admin had no healthcheck at all before this -- Docker
      # (and anything watching container health, like scripts/ops_monitor.py)
      # couldn't tell a hung/crashed admin from a healthy one.
      test:
        ["CMD", "python", "scripts/check_app_ready.py", "--http-port", "9001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    # Image default (65532:65532, non-root) -- no override needed.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Per-installation credential from the Cloudflare Zero Trust dashboard
      # (Networks -> Tunnels) -- see .env.prod.example and
      # documentation/ops/vps/DEPLOY.md step 8. Never shared across
      # installations: each one gets its own tunnel and token.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command:
      [
        "tunnel", "--no-autoupdate", "--metrics", "localhost:20241", "run",
      ]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    networks:
      - net-internal
    depends_on:
      admin:
        condition: service_started

  traefik-config:
    image: alpine:3.20
    # Only renders a file into a shared volume -- needs no network at all.
    network_mode: "none"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./traefik/render-dynamic-config.sh:/render/render-dynamic-config.sh:ro
      - traefik_dynamic_config:/etc/traefik/dynamic
    environment:
      - HP_PUBLIC_HOST=${HP_PUBLIC_HOST}
      - HP_PUBLIC_RATELIMIT_AVG=${HP_PUBLIC_RATELIMIT_AVG:-120}
      - HP_PUBLIC_RATELIMIT_BURST=${HP_PUBLIC_RATELIMIT_BURST:-240}
      - HP_PUBLIC_MAX_BODY_BYTES=${HP_PUBLIC_MAX_BODY_BYTES:-26214400}
    command: ["sh", "/render/render-dynamic-config.sh"]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 16
    restart: "no"

  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    # Stays root (its image's default and needed to bind :80/:443 inside its
    # own netns), but with every other capability dropped -- only
    # NET_BIND_SERVICE is actually used. Going fully non-root would need
    # remapping its entrypoints to high ports plus a chown-on-boot step for
    # the letsencrypt volume (the migrate pattern) -- left for a future
    # Issue if it's ever worth the added moving part.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    command:
      - "--api.dashboard=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.webinternal.address=:8081"
      # NOC-028: a dedicated ping entrypoint for the container healthcheck
      # below -- never published in `ports:` at all (not even on
      # loopback), since the HEALTHCHECK CMD runs inside this same
      # container's own network namespace and reaches it without any
      # port mapping. /ping is served only here, never on web/websecure.
      - "--entrypoints.traefik.address=:8082"
      - "--ping=true"
      - "--ping.entrypoint=traefik"
      # NOC-014: bound how long Traefik itself will wait on a slow/stalled
      # client (slow-loris style) before giving up -- independent of, and
      # slightly more generous than, the app's own REQUEST_TIMEOUT/
      # KEEPALIVE_TIMEOUT/IDLE_TIMEOUT (server_config.py), which only start
      # once Traefik has already forwarded a request.
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=30s"
      - "--entrypoints.web.transport.respondingTimeouts.writeTimeout=60s"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=180s"
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=30s"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=60s"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=180s"
      - "--entrypoints.webinternal.transport.respondingTimeouts.readTimeout=30s"
      - "--entrypoints.webinternal.transport.respondingTimeouts.writeTimeout=60s"
      - "--entrypoints.webinternal.transport.respondingTimeouts.idleTimeout=180s"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test:
        ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=traefik", "--entrypoints.traefik.address=:8082"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - traefik_dynamic_config:/etc/traefik/dynamic:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - net-edge
      - net-internal
    depends_on:
      traefik-config:
        condition: service_completed_successfully
      app:
        condition: service_healthy
      admin:
        condition: service_started

networks:
  # app only: reachable from traefik, can reach the internet (ASN/geo lookups,
  # egress proxy), but is never on the same network as admin/migrate.
  net-edge:
    name: hp-prod-edge
  # admin + migrate: traefik bridges both networks so admin can reach the
  # public decoy's /health through traefik's internal entrypoint (never
  # directly), but app has no network path to admin at all.
  net-internal:
    name: hp-prod-internal

volumes:
  hp_prod_data:
  hp_prod_myapp:
  traefik_letsencrypt:
  traefik_dynamic_config:
