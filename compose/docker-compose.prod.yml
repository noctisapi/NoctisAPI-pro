services:
  migrate:
    image: ${HP_IMAGE:-ghcr.io/0x-unkwn0wn/noctisapi-pro}:${APP_VERSION}
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:0 /data /var/lib/myapp && alembic upgrade head"]
    env_file:
      - ../.env.prod
    volumes:
      - hp_prod_data:/data
      - hp_prod_myapp:/var/lib/myapp
    networks:
      - net-internal
    restart: "no"

  app:
    image: ${HP_IMAGE:-ghcr.io/0x-unkwn0wn/noctisapi-pro}:${APP_VERSION}
    user: "10001:0"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ../.env.prod
    environment:
      - PYTHONPATH=/app
    command: ["python", "main.py"]
    volumes:
      - hp_prod_data:/data
      - hp_prod_myapp:/var/lib/myapp
      - /etc/machine-id:/etc/host-machine-id:ro
      - ../data/siem:/var/log/noctisapi
    expose:
      - "8000"
    networks:
      - net-edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "scripts/check_app_ready.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hp-api.rule=Host(`${HP_PUBLIC_HOST}`)"
      - "traefik.http.routers.hp-api.entrypoints=websecure"
      - "traefik.http.routers.hp-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.hp-api.loadbalancer.server.port=8000"
      - "traefik.http.routers.hp-api.middlewares=hp-public-ratelimit"
      - "traefik.http.middlewares.hp-public-ratelimit.ratelimit.average=${HP_PUBLIC_RATELIMIT_AVG:-120}"
      - "traefik.http.middlewares.hp-public-ratelimit.ratelimit.burst=${HP_PUBLIC_RATELIMIT_BURST:-240}"
      - "traefik.http.routers.hp-health.rule=Host(`${HP_PUBLIC_HOST}`) && (Path(`/health`) || Path(`/status`))"
      - "traefik.http.routers.hp-health.entrypoints=websecure"
      - "traefik.http.routers.hp-health.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hp-health.service=hp-api"
      - "traefik.http.routers.hp-health.priority=100"
      # Public, unauthenticated router reachable by anyone -- NOC-012: never
      # tag this traffic with the internal-monitor header (hp-monitor-headers
      # is for the truly internal webinternal entrypoint only, below).
      - "traefik.http.routers.hp-health.middlewares=hp-health-ratelimit"
      - "traefik.http.middlewares.hp-health-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.hp-health-ratelimit.ratelimit.burst=60"
      - "traefik.http.middlewares.hp-monitor-headers.headers.customrequestheaders.X-Internal-Monitor=1"
      - "traefik.http.middlewares.hp-monitor-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.hp-monitor-ratelimit.ratelimit.burst=60"
      - "traefik.http.routers.hp-internal.rule=PathPrefix(`/`)"
      - "traefik.http.routers.hp-internal.entrypoints=webinternal"
      - "traefik.http.routers.hp-internal.service=hp-api"
      - "traefik.http.routers.hp-internal.priority=120"
      - "traefik.http.routers.hp-internal.middlewares=hp-monitor-headers,hp-monitor-ratelimit"

  admin:
    image: ${HP_IMAGE:-ghcr.io/0x-unkwn0wn/noctisapi-pro}:${APP_VERSION}
    user: "10001:0"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ../.env.prod
    environment:
      - PYTHONPATH=/app
      # Routed through Traefik's internal entrypoint, not straight to `app`,
      # so admin never needs to be on the same Docker network as the public
      # decoy surface (see NOC-011 / net-edge vs net-internal below).
      - HONEYPOT_MONITOR_BASE_URL=http://traefik:8081
      - HP_PANEL_TOKEN=${HP_PANEL_TOKEN}
    command: ["python", "main_panel.py"]
    volumes:
      - hp_prod_data:/data
      - hp_prod_myapp:/var/lib/myapp
      - /etc/machine-id:/etc/host-machine-id:ro
    expose:
      - "9001"
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - net-internal
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.webinternal.address=:8081"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - net-edge
      - net-internal
    depends_on:
      app:
        condition: service_healthy
      admin:
        condition: service_started

networks:
  # app only: reachable from traefik, can reach the internet (ASN/geo lookups,
  # egress proxy), but is never on the same network as admin/migrate.
  net-edge:
    name: hp-prod-edge
  # admin + migrate: traefik bridges both networks so admin can reach the
  # public decoy's /health through traefik's internal entrypoint (never
  # directly), but app has no network path to admin at all.
  net-internal:
    name: hp-prod-internal

volumes:
  hp_prod_data:
  hp_prod_myapp:
  traefik_letsencrypt:
