services:
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../${HP_ENV_FILE:-.env.dev}
    volumes:
      - ../:/app
      - hp_dev_data:/data
      - hp_dev_myapp:/var/lib/myapp
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../${HP_ENV_FILE:-.env.dev}
    volumes:
      - ../:/app
      - hp_dev_data:/data
      - hp_dev_myapp:/var/lib/myapp
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: ["python", "main.py"]
    environment:
      - UVICORN_RELOAD=1
      - UVICORN_ACCESS_LOG=1
    healthcheck:
      test:
        ["CMD", "python", "scripts/check_app_ready.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  admin:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../${HP_ENV_FILE:-.env.dev}
    volumes:
      - ../:/app
      - hp_dev_data:/data
      - hp_dev_myapp:/var/lib/myapp
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9001:9001"
    command: ["python", "main_panel.py"]
    environment:
      - UVICORN_RELOAD=1
      - UVICORN_ACCESS_LOG=1

volumes:
  hp_dev_data:
  hp_dev_myapp:
