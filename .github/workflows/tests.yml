name: Tests

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check dependency resolution
        run: pip check

      - name: Run test suite
        run: python -m pytest tests/ -q

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dev compose
        run: |
          touch .env.dev
          docker compose -f compose/docker-compose.dev.yml config --quiet

      - name: Validate prod compose
        env:
          HP_PUBLIC_HOST: ci-placeholder.invalid
          HP_PANEL_TOKEN: ci-placeholder-token
          ACME_EMAIL: ci@example.invalid
          APP_VERSION: ci-placeholder
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder-tunnel-token
        run: |
          touch .env.prod
          docker compose -f compose/docker-compose.prod.yml config --quiet

      - name: Validate staging compose
        run: |
          cp .env.staging.example .env.staging
          docker compose -f compose/docker-compose.staging.yml config --quiet
