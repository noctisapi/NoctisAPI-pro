name: Build and Publish (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image version from git SHA
        id: version
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/noctisapi-pro
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/${{ github.repository_owner }}/noctisapi-pro:${{ steps.version.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      # -----------------------------------------------------------------------
      # Export image as .tar and upload to Cloudflare R2
      # Requires GitHub Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
      #                          R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
      # -----------------------------------------------------------------------

      - name: Export Docker image to tar
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/noctisapi-pro:${{ steps.version.outputs.sha }}
          docker save ghcr.io/${{ github.repository_owner }}/noctisapi-pro:${{ steps.version.outputs.sha }} \
            -o noctisapi-pro-${{ steps.version.outputs.sha }}.tar

      - name: Compute artifact metadata
        id: artifact
        run: |
          SHA256=$(sha256sum noctisapi-pro-${{ steps.version.outputs.sha }}.tar | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "filename=noctisapi-pro-${{ steps.version.outputs.sha }}.tar" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$SHA256" "noctisapi-pro-${{ steps.version.outputs.sha }}.tar" \
            > noctisapi-pro-${{ steps.version.outputs.sha }}.tar.sha256

      - name: Upload tar to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp \
            noctisapi-pro-${{ steps.version.outputs.sha }}.tar \
            s3://${{ secrets.R2_BUCKET_NAME }}/images/noctisapi-pro-${{ steps.version.outputs.sha }}.tar \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --region auto

          # Overwrite the "latest" pointer so licensing server can always find it
          aws s3 cp \
            noctisapi-pro-${{ steps.version.outputs.sha }}.tar \
            s3://${{ secrets.R2_BUCKET_NAME }}/images/noctisapi-pro-latest.tar \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --region auto

          aws s3 cp \
            noctisapi-pro-${{ steps.version.outputs.sha }}.tar.sha256 \
            s3://${{ secrets.R2_BUCKET_NAME }}/images/noctisapi-pro-${{ steps.version.outputs.sha }}.tar.sha256 \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --region auto

          aws s3 cp \
            noctisapi-pro-${{ steps.version.outputs.sha }}.tar.sha256 \
            s3://${{ secrets.R2_BUCKET_NAME }}/images/noctisapi-pro-latest.tar.sha256 \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --region auto

      - name: Notify licensing server of new image version
        run: |
          RESPONSE=$(curl --silent --show-error --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            -X POST "${{ secrets.LICENSING_SERVER_URL }}/v1/distribution/set-version" \
            -H "Cache-Control: no-cache, no-store, max-age=0" \
            -H "Pragma: no-cache" \
            -H "X-Admin-Token: ${{ secrets.LICENSING_ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${{ steps.version.outputs.sha }}\",\"sha256\":\"${{ steps.artifact.outputs.sha256 }}\"}")
          echo "$RESPONSE"
          POSTED_VERSION=$(printf '%s' "$RESPONSE" | jq -r '.version // empty')
          if [ "$POSTED_VERSION" != "${{ steps.version.outputs.sha }}" ]; then
            echo "Licensing server set-version response did not echo expected version '${{ steps.version.outputs.sha }}'" >&2
            exit 1
          fi

      - name: Verify licensing server current version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.sha }}
          LICENSING_SERVER_URL: ${{ secrets.LICENSING_SERVER_URL }}
          LICENSING_ADMIN_TOKEN: ${{ secrets.LICENSING_ADMIN_TOKEN }}
        run: |
          TMP_BODY=$(mktemp)
          VERIFIED=0

          for path in "/v1/distribution/status" "/admin/api/distribution"; do
            STATUS_URL="${LICENSING_SERVER_URL}${path}?_ts=$(date +%s)"
            HTTP_CODE=$(curl --silent --show-error \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              -H "X-Admin-Token: ${LICENSING_ADMIN_TOKEN}" \
              -o "$TMP_BODY" \
              -w "%{http_code}" \
              "$STATUS_URL")
            if [ "$HTTP_CODE" = "404" ]; then
              continue
            fi
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Licensing verification endpoint ${path} returned HTTP ${HTTP_CODE}" >&2
              cat "$TMP_BODY"
              exit 1
            fi

            RESPONSE=$(cat "$TMP_BODY")
            echo "$RESPONSE"
            CURRENT_VERSION=$(printf '%s' "$RESPONSE" | jq -r '.current_version // .image_version // .current.version // empty')
            if [ -z "$CURRENT_VERSION" ]; then
              echo "Licensing verification response did not expose current_version, image_version, or current.version" >&2
              exit 1
            fi
            if [ "$CURRENT_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "Licensing server current version '$CURRENT_VERSION' does not match expected '$EXPECTED_VERSION'" >&2
              exit 1
            fi
            VERIFIED=1
            break
          done

          if [ "$VERIFIED" != "1" ]; then
            echo "Licensing server does not expose a readable distribution status endpoint; refusing to mark publish as successful without read-back verification." >&2
            exit 1
          fi
          rm -f "$TMP_BODY"

      - name: Clean up old images from R2 (keep latest 3 + noctisapi-pro-latest.tar)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="${{ secrets.R2_BUCKET_NAME }}"
          LIST_JSON=$(aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --prefix "images/noctisapi-pro-" \
            --output json \
            --endpoint-url "$ENDPOINT" \
            --region auto)

          DELETE_KEYS=$(printf '%s' "$LIST_JSON" | jq -r '
            (.Contents // [])
            | map(select(
                (.Key | test("^images/noctisapi-pro-.*\\.tar$"))
                and (.Key != "images/noctisapi-pro-latest.tar")
              ))
            | sort_by(.LastModified)
            | if length > 3 then .[0:(length - 3)] else [] end
            | .[].Key
          ')

          if [ -z "$DELETE_KEYS" ]; then
            echo "No old versioned R2 images to delete."
            exit 0
          fi

          while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "Deleting old image: $key"
            aws s3 rm "s3://$BUCKET/$key" \
              --endpoint-url "$ENDPOINT" \
              --region auto
            aws s3 rm "s3://$BUCKET/${key}.sha256" \
              --endpoint-url "$ENDPOINT" \
              --region auto || true
          done <<EOF
          $DELETE_KEYS
          EOF
