name: Build and Publish (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/noctisapi-pro
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # -----------------------------------------------------------------------
      # Export image as .tar and upload to Cloudflare R2
      # Requires GitHub Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
      #                          R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
      # -----------------------------------------------------------------------

      - name: Set image version from git SHA
        id: version
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Export Docker image to tar
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/noctisapi-pro:latest
          docker save ghcr.io/${{ github.repository_owner }}/noctisapi-pro:latest \
            -o noctisapi-pro-${{ steps.version.outputs.sha }}.tar

      - name: Upload tar to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp \
            noctisapi-pro-${{ steps.version.outputs.sha }}.tar \
            s3://${{ secrets.R2_BUCKET_NAME }}/images/noctisapi-pro-${{ steps.version.outputs.sha }}.tar \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --region auto

          # Overwrite the "latest" pointer so licensing server can always find it
          aws s3 cp \
            noctisapi-pro-${{ steps.version.outputs.sha }}.tar \
            s3://${{ secrets.R2_BUCKET_NAME }}/images/noctisapi-pro-latest.tar \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --region auto

      - name: Notify licensing server of new image version
        run: |
          curl --fail -X POST "${{ secrets.LICENSING_SERVER_URL }}/v1/distribution/set-version" \
            -H "X-Admin-Token: ${{ secrets.LICENSING_ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"${{ steps.version.outputs.sha }}\"}"

      - name: Clean up old images from R2 (keep latest 3 + noctisapi-pro-latest.tar)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="${{ secrets.R2_BUCKET_NAME }}"

          # List all versioned tars sorted by LastModified (oldest first), exclude -latest.tar
          aws s3api list-objects \
            --bucket "$BUCKET" \
            --prefix "images/noctisapi-pro-" \
            --query "sort_by(Contents, &LastModified)[].Key" \
            --output text \
            --endpoint-url "$ENDPOINT" \
            --region auto \
          | tr '\t' '\n' \
          | grep -v 'noctisapi-pro-latest\.tar' \
          | head -n -3 \
          | while read key; do
              echo "Deleting old image: $key"
              aws s3 rm "s3://$BUCKET/$key" \
                --endpoint-url "$ENDPOINT" \
                --region auto
            done
