services:
  migrate:
    extends:
      file: compose/docker-compose.dev.yml
      service: migrate

  app:
    extends:
      file: compose/docker-compose.dev.yml
      service: app
    volumes:
      - ./app/pro_results_public_key.pem:/app/app/pro_results_public_key.pem:ro

  admin:
    extends:
      file: compose/docker-compose.dev.yml
      service: admin
    volumes:
      - ./app/pro_results_public_key.pem:/app/app/pro_results_public_key.pem:ro

volumes:
  hp_dev_data:
    name: hp-app_hp_dev_data
  hp_dev_myapp:
    name: hp-app_hp_dev_myapp
